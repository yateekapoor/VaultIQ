<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Vault Shield Icon -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#vaultGrad)" />
    <!-- Hexagonal Vault Door -->
    <path d="M30 18 L46 27 L46 45 L30 54 L14 45 L14 27 Z" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <!-- Center Lock Cog -->
    <circle cx="30" cy="36" r="8" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="30" cy="36" r="3.5" fill="#F59E0B" />
    <!-- Radiating security bolts -->
    <line x1="30" y1="23" x2="30" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="44" x2="30" y2="49" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="19" y1="36" x2="24" y2="36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="41" y2="36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- VaultIQ Wordmark -->
  <text x="82" y="44" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="28" font-weight="800" fill="currentColor" letter-spacing="-0.5">Vault<tspan fill="#3B82F6">IQ</tspan></text>
  <text x="83" y="58" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="0.8">AICTE FDR SECURITY DEPOSIT PORTAL</text>
  <!-- Regulatory Status Badge -->
  <rect x="230" y="24" width="82" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="271" y="38" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" text-anchor="middle">REGULATION</text>
</svg>
