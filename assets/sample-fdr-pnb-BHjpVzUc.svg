    <text x="80" y="66" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">IFSC: PUNB0123400 | CORE BANKING INSTRUMENT</text>

    <rect x="470" y="15" width="210" height="42" rx="4" fill="#881337"/>
