        <line x1="10" y1="70" x2="240" y2="70" stroke="#94A3B8" stroke-width="1"/>
        <text x="125" y="86" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Branch Operations Manager</text>
