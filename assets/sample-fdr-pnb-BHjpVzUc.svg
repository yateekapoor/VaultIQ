    <text x="15" y="42" font-size="16" font-weight="800" fill="#881337">PNB-FDR-2024-77412</text>

    <rect x="340" y="0" width="340" height="55" fill="#F8FAFC" stroke="#E2E8F0" rx="4"/>
    <text x="355" y="20" font-size="10" font-weight="600" fill="#64748B">SFMS UTR / UNIQUE REFERENCE</text>
